<header class="navbar">

  <!-- Botón del menú -->
  <button type="button" class="navbar-toggle" (click)="toggleSidebar()"
    [class.active]="sidebarOpen"
    [attr.aria-label]="sidebarOpen ? 'Contraer menú' : 'Abrir menú'"
    [attr.aria-expanded]="sidebarOpen">
    <span></span><span></span><span></span>
  </button>

  <!-- Marca -->
  <a class="navbar-brand" href="/" aria-label="Inicio">
    <span class="navbar-logo" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="2" y="14" width="26" height="15" rx="2.5" stroke="currentColor" stroke-width="2.6"/>
        <path d="M28 18h5.5l4 5v6H28" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="9" cy="31" r="3.2" fill="currentColor"/>
        <circle cx="31" cy="31" r="3.2" fill="currentColor"/>
      </svg>
    </span>
    <span class="navbar-appname">{{ brand.name }}</span>
  </a>

  <!-- Página actual -->
  <div class="navbar-center">
    <nav class="navbar-crumbs" aria-label="Ubicación">
      <span class="crumb-section" *ngIf="pageSection">{{ pageSection }}</span>
      <svg *ngIf="pageSection" class="crumb-sep" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 18 6-6-6-6"/>
      </svg>
      <span class="crumb-page">{{ pageTitle }}</span>
    </nav>
  </div>

  <!-- Acciones -->
  <div class="navbar-actions">
    <app-theme-toggle></app-theme-toggle>

    <div class="nav-divider" aria-hidden="true"></div>

    <div class="nav-user" [class.open]="userMenuOpen">
      <button type="button" class="nav-user-btn" (click)="toggleUserMenu($event)"
        aria-haspopup="menu" [attr.aria-expanded]="userMenuOpen">
        <span class="nav-avatar" aria-hidden="true">{{ userInitials }}</span>
        <span class="nav-user-info">
          <span class="nav-user-name">{{ userName }}</span>
          <span class="nav-user-role">{{ userRole }}</span>
        </span>
        <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <!-- Menú del usuario -->
      <div class="user-dropdown" *ngIf="userMenuOpen" role="menu">
        <div class="dropdown-header">
          <span class="nav-avatar nav-avatar--lg" aria-hidden="true">{{ userInitials }}</span>
          <div class="dropdown-who">
            <span class="dropdown-name">{{ userName }}</span>
            <span class="dropdown-email">{{ userEmail }}</span>
            <span class="dropdown-role">{{ userRole }}</span>
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <button type="button" class="menu-item" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Mi perfil
        </button>

        <div class="dropdown-divider"></div>

        <button type="button" class="menu-item menu-item--danger" role="menuitem" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</header>

<aside class="sidebar" [class.sidebar--collapsed]="!open">

  <nav class="sidebar-nav">

    <div class="nav-section-label" *ngIf="open">Principal</div>

    <a class="nav-item"
       *ngFor="let item of mainItems"
       [routerLink]="item.route"
       routerLinkActive="nav-item--active"
       [title]="!open ? item.label : ''">
      <span class="nav-icon" [innerHTML]="item.icon"></span>
      <span class="nav-label" *ngIf="open">{{ item.label }}</span>
      <span class="nav-badge-count" *ngIf="item.badge && open">{{ item.badge }}</span>
    </a>

    <div class="nav-divider"></div>

    <div class="nav-section-label" *ngIf="open">Sistema</div>

    <a class="nav-item"
       *ngFor="let item of systemItems"
       [routerLink]="item.route"
       routerLinkActive="nav-item--active"
       [title]="!open ? item.label : ''">
      <span class="nav-icon" [innerHTML]="item.icon"></span>
      <span class="nav-label" *ngIf="open">{{ item.label }}</span>
    </a>

  </nav>

  <div class="sidebar-footer" *ngIf="open">
    <div class="sidebar-version">
      <span class="version-dot"></span>
      <span>v2.4 · Producción</span>
    </div>
  </div>

</aside>

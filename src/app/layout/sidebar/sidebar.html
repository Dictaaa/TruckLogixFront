<aside class="sidebar"
  [class.sidebar--rail]="rail"
  [class.sidebar--mobile]="mobile"
  [class.sidebar--hidden]="mobile && !open"
  aria-label="Menú principal">

  <nav class="sidebar-nav">

    <!-- Enlaces sueltos -->
    <a *ngFor="let item of topItems; trackBy: trackByRoute"
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="nav-item--active"
      [attr.title]="rail ? item.label : null"
      (click)="onNavigate()">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path *ngFor="let d of item.icon" [attr.d]="d"/></svg>
      </span>
      <span class="nav-label">{{ item.label }}</span>
    </a>

    <div class="nav-section-label">Módulos</div>

    <!-- Grupos -->
    <div class="nav-group" *ngFor="let g of groups; trackBy: trackById">
      <button type="button" class="nav-item nav-item--group"
        [class.nav-item--current]="isGroupActive(g)"
        [class.nav-item--open]="isOpen(g)"
        [attr.title]="rail ? g.label : null"
        [attr.aria-expanded]="isOpen(g)"
        (click)="toggleGroup(g)">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path *ngFor="let d of g.icon" [attr.d]="d"/></svg>
        </span>
        <span class="nav-label">{{ g.label }}</span>
        <span class="nav-count" *ngIf="g.items.length > 1">{{ g.items.length }}</span>
        <svg class="nav-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <div class="nav-children" [class.nav-children--open]="isOpen(g)">
        <div class="nav-children-inner">
          <a *ngFor="let item of g.items; trackBy: trackByRoute"
            class="nav-child"
            [routerLink]="item.route"
            routerLinkActive="nav-child--active"
            [attr.tabindex]="isOpen(g) ? 0 : -1"
            (click)="onNavigate()">
            <span class="nav-child-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path *ngFor="let d of item.icon" [attr.d]="d"/></svg>
            </span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="sidebar-footer">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="nav-label">Sistema en línea</span>
  </div>
</aside>

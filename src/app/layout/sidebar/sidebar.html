<nav class="sidebar" [class.sidebar--collapsed]="!open">

  <div class="sidebar-section">

    <!-- Items principales filtrados -->
    <a *ngFor="let item of filteredMainItems"
      [routerLink]="item.route"
      routerLinkActive="nav-item--active"
      class="nav-item">
      <span class="nav-icon" [innerHTML]="item.icon"></span>
      <span class="nav-label">{{ item.label }}</span>
      <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>
    </a>
    <!-- Grupo Operaciones  -->
    <div class="nav-group" *appHasRole="[1, 2, 3]">
      <button class="nav-item nav-item--group"
        [class.nav-item--active]="isOperationActive()"
        [class.nav-item--open]="operationsOpen"
        (click)="toggleOperations()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M4 6h16M4 10h16M4 14h8M4 18h8"/>
          </svg>
        </span>
        <span class="nav-label">Operaciones</span>
        <span class="nav-chevron" [class.nav-chevron--open]="operationsOpen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </span>
      </button>

      <div class="nav-children" [class.nav-children--open]="operationsOpen">
        <a *ngFor="let item of filteredOperationItems"
          [routerLink]="item.route"
          routerLinkActive="nav-child--active"
          class="nav-child">
          <span class="nav-child-icon" [innerHTML]="item.icon"></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </div>
    </div>

    <!-- Grupo Mantenimientos  -->
    <div class="nav-group" *appHasRole="[1, 4]">
      <button class="nav-item nav-item--group"
        [class.nav-item--active]="isMaintenanceActive()"
        [class.nav-item--open]="maintenancesOpen"
        (click)="toggleMaintenances()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M4 6h16M4 10h16M4 14h8M4 18h8"/>
          </svg>
        </span>
        <span class="nav-label">Mantenimiento</span>
        <span class="nav-chevron" [class.nav-chevron--open]="maintenancesOpen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </span>
      </button>

      <div class="nav-children" [class.nav-children--open]="maintenancesOpen">
        <a *ngFor="let item of filteredMaintenanceItems"
          [routerLink]="item.route"
          routerLinkActive="nav-child--active"
          class="nav-child">
          <span class="nav-child-icon" [innerHTML]="item.icon"></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </div>
    </div>

    <!-- Grupo Maestros — visible para rol 1 -->
    <div class="nav-group" *appHasRole="[1]">
      <button class="nav-item nav-item--group"
        [class.nav-item--active]="isMasterActive()"
        [class.nav-item--open]="mastersOpen"
        (click)="toggleMasters()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M4 6h16M4 10h16M4 14h8M4 18h8"/>
          </svg>
        </span>
        <span class="nav-label">Maestros</span>
        <span class="nav-chevron" [class.nav-chevron--open]="mastersOpen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </span>
      </button>

      <div class="nav-children" [class.nav-children--open]="mastersOpen">
        <a *ngFor="let item of filteredMasterItems"
          [routerLink]="item.route"
          routerLinkActive="nav-child--active"
          class="nav-child">
          <span class="nav-child-icon" [innerHTML]="item.icon"></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </div>
    </div>

  </div>

  <div class="sidebar-section sidebar-section--bottom">
    <a *ngFor="let item of systemItems"
      [routerLink]="item.route"
      routerLinkActive="nav-item--active"
      class="nav-item">
      <span class="nav-icon" [innerHTML]="item.icon"></span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </div>

</nav>

<div class="page-wrapper">

  <header class="page-header">
    <div class="header-left">
      <span class="header-label">TRAZABILIDAD</span>
      <h1 class="header-title">Mantenimientos</h1>
    </div>
    <div class="actions-bar">
      <button class="btn-primary" *appHasRole="[1, 2, 4]" (click)="openModal()">
        + Nuevo Mantenimiento
      </button>
    </div>
  </header>

  <section class="table-section">
    <app-data-table
      [columns]="columns"
      [actions]="actions"
      [data]="records"
      [total]="total"
      [loading]="loading"
      exportName="mantenimientos"
      [showFilterBtn]="true"
      (pageChange)="onPageChange($event)"
      (actionSelect)="onAction($event)"
      (filterClick)="filterOpen = true">
    </app-data-table>
  </section>

</div>

<app-filter-panel
  [open]="filterOpen"
  [activeCount]="activeFilterCount"
  title="Filtros de Mantenimientos"
  (closed)="filterOpen = false"
  (apply)="applyFilters()"
  (clear)="clearFilters()">

  <!-- Fecha de ingreso -->
  <div class="filter-section">
    <div class="filter-section-label">Fecha de ingreso</div>
    <div class="filter-row-2">
      <div class="filter-field">
        <label class="filter-label">Desde</label>
        <input type="date" class="form-control" [(ngModel)]="filters.fecha_desde">
      </div>
      <div class="filter-field">
        <label class="filter-label">Hasta</label>
        <input type="date" class="form-control" [(ngModel)]="filters.fecha_hasta">
      </div>
    </div>

    <div class="filter-field">
      <label class="filter-label">Estado</label>
      <select class="form-control" [(ngModel)]="filters.estado">
        <option value="">Todos</option>
        <option *ngFor="let e of estadoOptions" [value]="e.value">{{ e.label }}</option>
      </select>
    </div>
  </div>

  <!-- Vehículo -->
  <div class="filter-section">
    <div class="filter-section-label">Vehículo</div>

    <div class="filter-field">
      <label class="filter-label">Placa</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="form-control has-icon" placeholder="Buscar placa…"
          [ngModel]="ac.vehicle_id.ctrl.value" (ngModelChange)="ac.vehicle_id.ctrl.setValue($event)"
          [matAutocomplete]="autoVehiculo">
      </div>
      <mat-autocomplete #autoVehiculo="matAutocomplete" [displayWith]="displayFn('plate')"
        (optionSelected)="onSelect('vehicle_id', $event.option.value)">
        <mat-option *ngFor="let v of ac.vehicle_id.filtered$ | async" [value]="v">{{ v.plate }}</mat-option>
      </mat-autocomplete>
    </div>

    <div class="filter-field">
      <label class="filter-label">Placa Tráiler</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="form-control has-icon" placeholder="Buscar tráiler…"
          [ngModel]="ac.trailer_plate_id.ctrl.value" (ngModelChange)="ac.trailer_plate_id.ctrl.setValue($event)"
          [matAutocomplete]="autoTrailer">
      </div>
      <mat-autocomplete #autoTrailer="matAutocomplete" [displayWith]="displayFn('plate')"
        (optionSelected)="onSelect('trailer_plate_id', $event.option.value)">
        <mat-option *ngFor="let t of ac.trailer_plate_id.filtered$ | async" [value]="t">{{ t.plate }}</mat-option>
      </mat-autocomplete>
    </div>

    <div class="filter-field">
      <label class="filter-label">Marca</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="form-control has-icon" placeholder="Buscar marca…"
          [ngModel]="ac.brand_id.ctrl.value" (ngModelChange)="ac.brand_id.ctrl.setValue($event)"
          [matAutocomplete]="autoMarca">
      </div>
      <mat-autocomplete #autoMarca="matAutocomplete" [displayWith]="displayFn('name')"
        (optionSelected)="onSelect('brand_id', $event.option.value)">
        <mat-option *ngFor="let b of ac.brand_id.filtered$ | async" [value]="b">{{ b.name }}</mat-option>
      </mat-autocomplete>
    </div>

    <div class="filter-field" *ngIf="!isAffiliate">
      <label class="filter-label">Afiliado</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="form-control has-icon" placeholder="Buscar afiliado…"
          [ngModel]="ac.affiliate_id.ctrl.value" (ngModelChange)="ac.affiliate_id.ctrl.setValue($event)"
          [matAutocomplete]="autoAfiliado">
      </div>
      <mat-autocomplete #autoAfiliado="matAutocomplete" [displayWith]="displayFn('name')"
        (optionSelected)="onSelect('affiliate_id', $event.option.value)">
        <mat-option *ngFor="let a of ac.affiliate_id.filtered$ | async" [value]="a">{{ a.name }}</mat-option>
      </mat-autocomplete>
    </div>
  </div>

  <!-- Mantenimiento -->
  <div class="filter-section">
    <div class="filter-section-label">Mantenimiento</div>

    <div class="filter-field">
      <label class="filter-label">Tipo de Mtto</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="form-control has-icon" placeholder="Buscar tipo…"
          [ngModel]="ac.maintenance_type_id.ctrl.value" (ngModelChange)="ac.maintenance_type_id.ctrl.setValue($event)"
          [matAutocomplete]="autoTipo">
      </div>
      <mat-autocomplete #autoTipo="matAutocomplete" [displayWith]="displayFn('name')"
        (optionSelected)="onSelect('maintenance_type_id', $event.option.value)">
        <mat-option *ngFor="let t of ac.maintenance_type_id.filtered$ | async" [value]="t">{{ t.name }}</mat-option>
      </mat-autocomplete>
    </div>
  </div>

</app-filter-panel>

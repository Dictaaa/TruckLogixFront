<div class="modal-wrapper">

  <div class="modal-header">
    <h2 class="modal-title">{{ title }}</h2>
    <button class="modal-close" (click)="close()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="modal-body">

    <!-- Fila 1: Fecha + Vehículo + Afiliado -->
    <div class="form-row cols-3">
      <div class="form-group">
        <label class="form-label">Fecha <span class="required">*</span></label>
        <input type="date" class="form-control" [(ngModel)]="form.fuel_date">
      </div>
      <div class="form-group">
        <label class="form-label">Placa <span class="required">*</span></label>
        <select class="form-control" [(ngModel)]="form.vehicle_id">
          <option [ngValue]="null">Seleccionar...</option>
          <option *ngFor="let v of vehicles" [value]="v.id">{{ v.plate }}</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Afiliado</label>
        <select class="form-control" [(ngModel)]="form.affiliate_id">
          <option [ngValue]="null">Seleccionar...</option>
          <option *ngFor="let a of affiliates" [value]="a.id">{{ a.name }}</option>
        </select>
      </div>
    </div>

    <!-- Fila 2: Km inicial + Km final + Km recorrido (readonly) -->
    <div class="form-row cols-3">
      <div class="form-group">
        <label class="form-label">Km Inicial <span class="required">*</span></label>
        <input type="number" class="form-control" [(ngModel)]="form.km_initial" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Km Final <span class="required">*</span></label>
        <input type="number" class="form-control" [(ngModel)]="form.km_final" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Km Recorrido</label>
        <div class="form-control form-control--readonly">
          {{ kmRecorrido | number:'1.0-0' }} km
        </div>
      </div>
    </div>

    <!-- Fila 3: Galones + Precio/Galón + Total -->
    <div class="form-row cols-3">
      <div class="form-group">
        <label class="form-label">Galones <span class="required">*</span></label>
        <input type="number" class="form-control" [(ngModel)]="form.gallons" min="0" step="0.001" placeholder="0.000">
      </div>
      <div class="form-group">
        <label class="form-label">Precio por Galón <span class="required">*</span></label>
        <input type="number" class="form-control" [(ngModel)]="form.price_per_gallon" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Total</label>
        <div class="form-control form-control--total">
          $ {{ totalValor | number:'1.0-0' }}
        </div>
      </div>
    </div>

    <!-- Observaciones -->
    <div class="form-row">
      <div class="form-group full">
        <label class="form-label">Observaciones</label>
        <textarea class="form-control" [(ngModel)]="form.observations" rows="2" placeholder="Notas adicionales..."></textarea>
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn-secondary" (click)="close()" [disabled]="saving">Cancelar</button>
    <button class="btn-primary" (click)="save()" [disabled]="saving">
      <span *ngIf="!saving">{{ isEdit ? 'Actualizar' : 'Guardar' }}</span>
      <span *ngIf="saving">Guardando...</span>
    </button>
  </div>

</div>

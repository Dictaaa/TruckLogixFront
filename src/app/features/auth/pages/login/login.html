<div class="login-page">

  <!-- Fondo sutil -->
  <div class="login-bg" aria-hidden="true"></div>

  <!-- Barra superior: solo el cambio de tema -->
  <header class="login-topbar">
    <app-theme-toggle></app-theme-toggle>
  </header>

  <main class="login-main">
    <div class="login-card">

      <!-- Marca -->
      <div class="login-brand">
        <div class="login-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <rect x="2" y="14" width="26" height="15" rx="2.5" stroke="currentColor" stroke-width="2.2"/>
            <path d="M28 18h5.5l4 5v6H28" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <line x1="11" y1="14" x2="11" y2="29" stroke="currentColor" stroke-width="1.6" opacity="0.5"/>
            <line x1="19" y1="14" x2="19" y2="29" stroke="currentColor" stroke-width="1.6" opacity="0.5"/>
            <circle cx="9" cy="31" r="3.2" fill="currentColor"/>
            <circle cx="31" cy="31" r="3.2" fill="currentColor"/>
          </svg>
        </div>
        <div class="login-brand-text">
          <span class="login-brand-name">{{ brand.name }}</span>
          <span class="login-brand-sub">{{ brand.tagline }}</span>
        </div>
      </div>

      <h1 class="login-title">Inicia sesión</h1>
      <p class="login-subtitle">Ingresa tus credenciales para continuar.</p>

      <form [formGroup]="form" class="login-form" (ngSubmit)="login()" novalidate>

        <!-- Correo -->
        <div class="field">
          <label class="field-label" for="email">Correo electrónico</label>
          <div class="field-control">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <path d="m2 7 10 7 10-7"/>
            </svg>
            <input id="email" class="field-input" formControlName="email" type="email"
              placeholder="usuario@empresa.com" autocomplete="email"
              [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
          </div>
        </div>

        <!-- Contraseña -->
        <div class="field">
          <div class="field-label-row">
            <label class="field-label" for="password">Contraseña</label>
            <a href="#" class="field-link">¿La olvidaste?</a>
          </div>
          <div class="field-control">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input id="password" class="field-input has-action" formControlName="password"
              [type]="showPassword ? 'text' : 'password'" placeholder="••••••••"
              autocomplete="current-password"
              [class.is-invalid]="form.get('password')?.touched && form.get('password')?.invalid">
            <button type="button" class="field-action" (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error -->
        <div class="login-error" *ngIf="errorMsg" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ errorMsg }}</span>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn-login" [class.is-loading]="loading" [disabled]="loading">
          <ng-container *ngIf="!loading">
            Ingresar
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </ng-container>

          <!-- Cargando: camión animado -->
          <svg *ngIf="loading" class="truck-loader" viewBox="0 0 120 32" width="110" height="30" aria-label="Ingresando">
            <line class="tl-road" x1="0" y1="28" x2="120" y2="28" stroke="currentColor" stroke-opacity="0.45" stroke-width="1"/>
            <circle class="tl-smoke tl-s1" cx="10" cy="14" r="2.5" fill="currentColor" fill-opacity="0.45"/>
            <circle class="tl-smoke tl-s2" cx="7"  cy="10" r="2"   fill="currentColor" fill-opacity="0.35"/>
            <circle class="tl-smoke tl-s3" cx="5"  cy="7"  r="1.5" fill="currentColor" fill-opacity="0.25"/>
            <g class="tl-truck">
              <rect x="11" y="10" width="2.5" height="7" rx="0.5" fill="currentColor" fill-opacity="0.6"/>
              <rect x="14" y="12" width="62" height="14" rx="2" fill="currentColor" fill-opacity="0.25"/>
              <rect x="76" y="14" width="22" height="12" rx="2" fill="currentColor" fill-opacity="0.35"/>
              <rect x="81" y="16" width="11" height="6" rx="1.5" fill="currentColor" fill-opacity="0.6"/>
              <g class="tl-wheel"><circle cx="28" cy="27" r="4" fill="currentColor" fill-opacity="0.4"/></g>
              <g class="tl-wheel"><circle cx="42" cy="27" r="4" fill="currentColor" fill-opacity="0.4"/></g>
              <g class="tl-wheel"><circle cx="64" cy="27" r="4" fill="currentColor" fill-opacity="0.4"/></g>
              <g class="tl-wheel"><circle cx="88" cy="27" r="4" fill="currentColor" fill-opacity="0.4"/></g>
            </g>
          </svg>
        </button>
      </form>
    </div>

    <p class="login-help">
      ¿Problemas para ingresar?
      <a href="mailto:soporte@trucklogix.co">Contactar soporte</a>
    </p>
  </main>

  <footer class="login-footer">© {{ year }} D&amp;M Logistics</footer>
</div>

<div class="login-container">

  <mat-card>

    <h1>TruckLogix</h1>

    <form [formGroup]="form">

      <mat-form-field appearance="outline">

        <mat-label>Email</mat-label>

        <input
          matInput
          formControlName="email"
          type="email">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Password</mat-label>

        <input
          matInput
          formControlName="password"
          type="password">

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        (click)="login()"
        [disabled]="loading">

        Login

      </button>

    </form>

  </mat-card>

</div>

<div class="page-wrapper">

  <header class="page-header">
    <div class="header-left">
      <span class="header-label">MAESTROS</span>
      <h1 class="header-title">Presupuestos de Afiliados</h1>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="openModal()">
        + Nuevo Presupuesto
      </button>
    </div>
  </header>

  <!-- Filtros -->
  <section class="filters-panel">
    <div class="filters-grid">
      <div class="filter-group">
        <label class="filter-label">Afiliado</label>
        <select class="filter-select" [(ngModel)]="selectedAffiliate" (ngModelChange)="load()">
          <option value="">Todos</option>
          <option *ngFor="let a of affiliates" [value]="a.id">{{ a.name }}</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Año</label>
        <select class="filter-select" [(ngModel)]="selectedYear" (ngModelChange)="load()">
          <option *ngFor="let y of yearOptions" [value]="y">{{ y }}</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Loading -->
  <div class="loading-cell" *ngIf="loading">
    <div class="spinner"></div>
    <span>Cargando presupuestos…</span>
  </div>

  <!-- Tabla por afiliado -->
  <ng-container *ngIf="!loading">

    <div class="budget-block" *ngFor="let aff of affiliates">

      <div class="budget-header">
        <span class="budget-aff-name">{{ aff.name }}</span>
        <div class="budget-header-right">
          <span class="budget-total">
            Total año: <strong>$ {{ totalByAffiliate(aff.id) | number:'1.0-0' }}</strong>
          </span>
          <button class="btn-edit-sm" (click)="openModal(aff)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Editar
          </button>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="data-table budget-table">
          <thead>
            <tr>
              <th *ngFor="let m of months" class="col-mes"
                [class.col-current]="m === currentMonth">
                {{ monthNames[m] }}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td *ngFor="let m of months" class="td-money"
                [class.td-current]="m === currentMonth"
                [class.td-empty]="getBudget(aff.id, m) === 0">
                <span *ngIf="getBudget(aff.id, m) > 0">
                  $ {{ getBudget(aff.id, m) | number:'1.0-0' }}
                </span>
                <span *ngIf="getBudget(aff.id, m) === 0" class="text-muted">—</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <div class="empty-state" *ngIf="affiliates.length === 0">
      <p>No hay afiliados registrados</p>
    </div>

  </ng-container>

</div>

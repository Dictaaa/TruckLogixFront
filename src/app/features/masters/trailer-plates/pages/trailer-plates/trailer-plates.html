
<div class="page-wrapper">
  <header class="page-header">
    <div class="header-left">
      <span class="header-label">MAESTROS</span>
      <h1 class="header-title">Placas Trailer</h1>
    </div>

    <div class="actions-bar">
      <button
        class="btn-primary"
        (click)="openModal()">
        + Nueva Placa Trailer
      </button>
    </div>
  </header>

  <section class="table-section">
    <app-data-table
      [columns]="columns"
      [actions]="actions"
      [data]="records"
      [total]="total"
      [loading]="loading"
      [showFilterBtn]="true"
      exportName="placas-trailer"
      (pageChange)="onPageChange($event)"
      (actionSelect)="onAction($event)"
      (filterClick)="filterOpen = true">
    </app-data-table>

    <app-filter-panel
      [open]="filterOpen"
      [activeCount]="activeFilterCount"
      title="Filtrar placas trailer"
      (closed)="filterOpen = false"
      (apply)="applyFilters()"
      (clear)="clearFilters()">

      <div class="filter-fields">
        <!-- Fecha de creación -->
    <div class="filter-field">
      <label class="filter-label">Fecha de creación</label>

      <div class="filter-row-2">

        <div class="filter-field">
          <label class="filter-label">Desde</label>

          <input
            type="date"
            class="form-control"
            [max]="filters.fechaHasta || null"
            [(ngModel)]="filters.fechaDesde">
        </div>

        <div class="filter-field">
          <label class="filter-label">Hasta</label>

          <input
            type="date"
            class="form-control"
            [min]="filters.fechaDesde || null"
            [(ngModel)]="filters.fechaHasta">
        </div>

      </div>
    </div>
        <div class="filter-field">
          <label class="filter-label">Placa trailer</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="filters.plate"
            placeholder="Buscar placa">
        </div>

        <div class="filter-field">
          <label class="filter-label">Placa cabezote</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="filters.vehiclePlate"
            placeholder="Buscar cabezote">
        </div>
      </div>
    </app-filter-panel>
  </section>
</div>

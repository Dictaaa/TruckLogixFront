<div class="page-wrapper">
  <header class="page-header">
    <div class="header-left">
      <span class="header-label">MAESTROS</span>
      <h1 class="header-title">Placas Trailer</h1>
    </div>
    <div class="actions-bar">
      <button class="btn-primary" (click)="openModal()">+ Nueva Placa Trailer</button>
    </div>
  </header>
  <section class="table-section">
    <app-data-table
      [columns]="columns"
      [actions]="actions"
      [data]="records"
      [total]="total"
      [loading]="loading"
      exportName="placas-trailer"
      (pageChange)="onPageChange($event)"
      (actionSelect)="onAction($event)">
    </app-data-table>
  </section>
</div>

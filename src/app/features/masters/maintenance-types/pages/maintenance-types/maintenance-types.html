
<div class="page-wrapper">

  <header class="page-header">
    <div class="header-left">
      <span class="header-label">MAESTROS</span>
      <h1 class="header-title">Tipos de Mantenimiento</h1>
    </div>

    <div class="actions-bar">
      <button class="btn-primary" (click)="openModal()">
        + Nuevo Tipo
      </button>
    </div>
  </header>

  <section class="table-section">
    <app-data-table
      [columns]="columns"
      [actions]="actions"
      [data]="table.rows"
      [total]="table.total"
      [loading]="loading"
      exportName="tipos-mantenimiento"
      [showFilterBtn]="true"
      (pageChange)="onPageChange($event)"
      (actionSelect)="onAction($event)"
      (filterClick)="filterOpen = true">
    </app-data-table>
  </section>

</div>

<app-filter-panel
  [open]="filterOpen"
  [activeCount]="activeFilterCount"
  title="Filtros de tipos de mantenimiento"
  (closed)="filterOpen = false"
  (apply)="applyFilters()"
  (clear)="clearFilters()">

  <div class="filter-fields">

     <!-- Fecha de creación -->
    <div class="filter-field">
      <label class="filter-label">Fecha de creación</label>

      <div class="filter-row-2">

        <div class="filter-field">
          <label class="filter-label">Desde</label>

          <input
            type="date"
            class="form-control"
            [max]="filters.fechaHasta || null"
            [(ngModel)]="filters.fechaDesde">
        </div>

        <div class="filter-field">
          <label class="filter-label">Hasta</label>

          <input
            type="date"
            class="form-control"
            [min]="filters.fechaDesde || null"
            [(ngModel)]="filters.fechaHasta">
        </div>

      </div>
    </div>

    <div class="filter-field">
      <label class="filter-label">Nombre</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="filters.nombre"
        placeholder="Buscar tipo de mantenimiento">
    </div>

    <div class="filter-field">
      <label class="filter-label">Estado</label>
      <select class="form-control" [(ngModel)]="filters.estado">
        <option value="">Todos</option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>

  </div>

</app-filter-panel>

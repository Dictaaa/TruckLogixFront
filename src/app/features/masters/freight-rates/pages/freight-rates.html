<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <span class="page-eyebrow">Maestros</span>
      <h1 class="page-title">Tarifas de Flete</h1>
    </div>
    <button class="btn-primary" (click)="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Nueva tarifa
    </button>
  </div>

  <section class="table-section">
    <app-data-table
      [columns]="columns"
      [actions]="actions"
      [data]="table.rows"
      [total]="table.total"
      [loading]="loading"
      exportName="tarifas-flete"
      [showFilterBtn]="true"
      (pageChange)="onPageChange($event)"
      (actionSelect)="onAction($event)"
      (filterClick)="filterOpen = true">
    </app-data-table>
  </section>

</div>

<!-- ═══ PANEL DE FILTROS ═══ -->
<app-filter-panel
  [open]="filterOpen"
  [activeCount]="activeFilterCount"
  title="Filtros de Tarifas"
  (closed)="filterOpen = false"
  (apply)="applyFilters()"
  (clear)="clearFilters()">

  <!-- Ruta -->
  <div class="filter-section">
    <div class="filter-section-label">Ruta</div>

    <div class="filter-field">
      <label class="filter-label">Empresa de transporte</label>
      <select class="form-control" [(ngModel)]="filters.empresa">
        <option value="">Todas</option>
        <option *ngFor="let c of companyOptions" [value]="c">{{ c }}</option>
      </select>
    </div>

    <div class="filter-row-2">
      <div class="filter-field">
        <label class="filter-label">Origen</label>
        <select class="form-control" [(ngModel)]="filters.origen">
          <option value="">Todos</option>
          <option *ngFor="let o of originOptions" [value]="o">{{ o }}</option>
        </select>
      </div>
      <div class="filter-field">
        <label class="filter-label">Destino</label>
        <select class="form-control" [(ngModel)]="filters.destino">
          <option value="">Todos</option>
          <option *ngFor="let d of destOptions" [value]="d">{{ d }}</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Tarifa -->
  <div class="filter-section">
    <div class="filter-section-label">Tarifa</div>

    <div class="filter-row-2">
      <div class="filter-field">
        <label class="filter-label">Condición</label>
        <select class="form-control" [(ngModel)]="filters.condicion">
          <option value="">Todas</option>
          <option *ngFor="let c of conditionOptions" [value]="c.value">{{ c.label }}</option>
        </select>
      </div>
      <div class="filter-field">
        <label class="filter-label">Estado</label>
        <select class="form-control" [(ngModel)]="filters.estado">
          <option value="">Todos</option>
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>
    </div>
  </div>

</app-filter-panel>

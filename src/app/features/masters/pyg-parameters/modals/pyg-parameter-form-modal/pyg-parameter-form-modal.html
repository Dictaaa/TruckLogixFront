<div class="modal-header">
  <div class="modal-header-left">
    <span class="modal-eyebrow">Maestros</span>
    <h2 class="modal-title">{{ isEdit ? 'Editar Parámetros PYG' : 'Nuevos Parámetros PYG' }}</h2>
  </div>
  <button class="btn-close" (click)="close()" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <path d="M18 6 6 18M6 6l12 12"/>
    </svg>
  </button>
</div>

<mat-dialog-content class="modal-body">

  <!-- Vigencia -->
  <div class="form-section">
    <div class="form-section-label">Vigencia</div>
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">Aplica a <span class="required">*</span></label>
        <select class="form-control" [(ngModel)]="scope" (ngModelChange)="onScopeChange()">
          <option value="general">Todas las placas (general)</option>
          <option value="vehicle">Una placa</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Vigente desde <span class="required">*</span></label>
        <input type="date" class="form-control" [(ngModel)]="form['valid_from']"
          (ngModelChange)="loadCurrent()"
          [class.field-error]="fieldErrors['valid_from']">
      </div>

      <div class="form-group" *ngIf="!isGeneral">
        <label class="form-label">Placa <span class="required">*</span></label>
        <div class="input-icon-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" class="form-control has-icon mono" placeholder="Buscar placa…"
            [formControl]="vehiculoCtrl" [matAutocomplete]="autoVehiculo"
            [class.field-error]="fieldErrors['vehicle_id']">
        </div>
        <mat-autocomplete #autoVehiculo="matAutocomplete" [displayWith]="displayFn"
          (optionSelected)="onSelectVehiculo($event.option.value)">
          <mat-option *ngFor="let v of filteredVehicles$ | async" [value]="v">{{ v.plate }}</mat-option>
        </mat-autocomplete>
      </div>

    </div>

    <p class="pyg-help">
      Los valores aplican desde esa fecha en adelante. Deja vacío lo que no cambia: se toma de la versión anterior
      <ng-container *ngIf="!isGeneral"> o del valor general</ng-container>.
    </p>
  </div>

  <!-- Costos mensuales -->
  <div class="form-section">
    <div class="form-section-label">Costos mensuales</div>
    <div class="form-grid">
      <div class="form-group" *ngFor="let f of monthlyFields">
        <label class="form-label">
          {{ f.label }}
          <span *ngIf="f.hint" class="form-hint-label"> ({{ f.hint }})</span>
        </label>
        <input type="number" class="form-control mono" min="0"
          [step]="f.kind === 'pct' ? 0.5 : 1"
          [(ngModel)]="form[f.key]"
          [placeholder]="placeholder(f)">
      </div>
    </div>
  </div>

  <!-- Costos anuales → provisiones -->
  <div class="form-section">
    <div class="form-section-label">Costos anuales (provisión ÷ 12)</div>
    <div class="form-grid">
      <div class="form-group" *ngFor="let f of annualFields">
        <label class="form-label">
          {{ f.label }}
          <span *ngIf="f.hint" class="form-hint-label"> ({{ f.hint }})</span>
        </label>
        <input type="number" class="form-control mono" min="0" step="1"
          [(ngModel)]="form[f.key]"
          [placeholder]="placeholder(f)">
      </div>
    </div>
  </div>

  <!-- Nota -->
  <div class="form-section">
    <div class="form-section-label">Nota</div>
    <div class="form-group">
      <input type="text" class="form-control" maxlength="255" [(ngModel)]="form['notes']"
        placeholder="Ej: aumento de salario julio, renovación SOAT">
    </div>
  </div>

</mat-dialog-content>

<mat-dialog-actions class="modal-footer">
  <button class="btn-cancel" (click)="close()">Cancelar</button>
  <button class="btn-save" (click)="save()" [disabled]="saving">
    <svg *ngIf="!saving" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    <div *ngIf="saving" class="spinner" style="width:14px;height:14px;border-width:2px;border-top-color:#fff"></div>
    {{ saving ? 'Guardando…' : 'Guardar' }}
  </button>
</mat-dialog-actions>

<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <span class="page-eyebrow">Maestros</span>
      <h1 class="page-title">Vehículos</h1>
    </div>

    <button class="btn-primary" (click)="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Nuevo vehículo
    </button>
  </div>

  <section class="table-section">

    <app-data-table [columns]="columns" [actions]="actions" [data]="table.rows" [total]="table.total"
      [loading]="loading" exportName="vehiculos" [showFilterBtn]="true" (pageChange)="onPageChange($event)"
      (actionSelect)="onAction($event)" (filterClick)="filterOpen = true">
    </app-data-table>

  </section>

</div>

<app-filter-panel [open]="filterOpen" [activeCount]="activeFilterCount" title="Filtros de vehículos"
  (closed)="filterOpen = false" (apply)="applyFilters()" (clear)="clearFilters()">

  <div class="filter-fields">

    <!-- Fecha de creación -->
    <div class="filter-field">
      <label class="filter-label">Fecha de creación</label>

      <div class="filter-row-2">

        <div class="filter-field">
          <label class="filter-label">Desde</label>

          <input type="date" class="form-control" [max]="filters.fechaHasta || null" [(ngModel)]="filters.fechaDesde">
        </div>

        <div class="filter-field">
          <label class="filter-label">Hasta</label>

          <input type="date" class="form-control" [min]="filters.fechaDesde || null" [(ngModel)]="filters.fechaHasta">
        </div>

      </div>
    </div>

    <div class="filter-field">
      <label class="filter-label">Placa</label>
      <input type="text" class="form-control" [(ngModel)]="filters.placa" placeholder="Buscar placa">
    </div>

    <div class="filter-field">
      <label class="filter-label">SOAT</label>
      <div class="filter-row-2">
        <div class="filter-field">
          <label class="filter-label">Desde</label>
          <input type="date" class="form-control" [(ngModel)]="filters.soatDesde">
        </div>

        <div class="filter-field">
          <label class="filter-label">Hasta</label>
          <input type="date" class="form-control" [(ngModel)]="filters.soatHasta">
        </div>
      </div>
    </div>

    <div class="filter-field">
      <label class="filter-label">RTM</label>
      <div class="filter-row-2">
        <div class="filter-field">
          <label class="filter-label">Desde</label>
          <input type="date" class="form-control" [(ngModel)]="filters.rtmDesde">
        </div>

        <div class="filter-field">
          <label class="filter-label">Hasta</label>
          <input type="date" class="form-control" [(ngModel)]="filters.rtmHasta">
        </div>
      </div>
    </div>

    <div class="filter-field">
      <label class="filter-label">Estado</label>
      <select class="form-control" [(ngModel)]="filters.estado">
        <option value="">Todos</option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>

  </div>

</app-filter-panel>

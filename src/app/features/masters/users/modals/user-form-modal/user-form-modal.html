<div class="modal-header">
  <div class="modal-header-left">
    <span class="modal-eyebrow">Maestros</span>
    <h2 class="modal-title">{{ isEdit ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
  </div>
  <button class="btn-close" (click)="close()" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
      <path d="M18 6 6 18M6 6l12 12"/>
    </svg>
  </button>
</div>

<mat-dialog-content class="modal-body">

  <div class="form-section">
    <div class="form-section-label">Información Personal</div>
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">Nombre <span class="required">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="form.first_name"
          placeholder="Primer nombre"
          [class.field-error]="fieldErrors['first_name']">
      </div>

      <div class="form-group">
        <label class="form-label">Apellido <span class="required">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="form.last_name"
          placeholder="Primer apellido"
          [class.field-error]="fieldErrors['last_name']">
      </div>

      <div class="form-group">
        <label class="form-label">Documento <span class="required">*</span></label>
        <input type="text" class="form-control mono" [(ngModel)]="form.document_number"
          placeholder="Número de documento"
          [class.field-error]="fieldErrors['document_number']">
      </div>

      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control mono" [(ngModel)]="form.phone_number_id"
          placeholder="3001234567">
      </div>

    </div>
  </div>

  <div class="form-section">
    <div class="form-section-label">Acceso</div>
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" class="form-control" [(ngModel)]="form.email"
          placeholder="correo@empresa.com"
          [class.field-error]="fieldErrors['email']">
      </div>

      <div class="form-group">
        <label class="form-label">
          {{ isEdit ? 'Nueva Contraseña' : 'Contraseña' }}
          <span *ngIf="!isEdit" class="form-hint-label"> (por defecto: documento)</span>
        </label>
        <div class="input-password-wrap">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control has-icon-right"
            [(ngModel)]="form.password"
            [placeholder]="isEdit ? 'Dejar vacío para no cambiar' : 'Contraseña'">
          <button type="button" class="btn-toggle-password" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Perfil <span class="required">*</span></label>
        <select class="form-control" [(ngModel)]="form.role"
          [class.field-error]="fieldErrors['role']">
          <option value="">Seleccionar…</option>
          <option *ngFor="let p of profiles" [value]="p.id">{{ p.label }}</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Estado</label>
        <select class="form-control" [(ngModel)]="form.active">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>

    </div>
  </div>

  <!-- Afiliado — solo visible si rol = 3 -->
  <div class="form-section" *ngIf="form.role == 3">
    <div class="form-section-label">Afiliado Asociado</div>
    <div class="form-grid">

      <div class="form-group">
        <label class="form-label">Afiliado</label>
        <div class="input-icon-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" class="form-control has-icon" placeholder="Buscar afiliado…"
            [formControl]="afiliadoCtrl" [matAutocomplete]="autoAfiliado">
        </div>
        <mat-autocomplete #autoAfiliado="matAutocomplete" [displayWith]="displayFn"
          (optionSelected)="onSelectAfiliado($event.option.value)">
          <mat-option *ngFor="let a of filteredAffiliates$ | async" [value]="a">{{ a.name }}</mat-option>
        </mat-autocomplete>
      </div>

    </div>
  </div>

</mat-dialog-content>

<mat-dialog-actions class="modal-footer">
  <button class="btn-cancel" (click)="close()">Cancelar</button>
  <button class="btn-save" (click)="save()" [disabled]="saving">
    <svg *ngIf="!saving" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    <div *ngIf="saving" class="spinner" style="width:14px;height:14px;border-width:2px;border-top-color:#fff"></div>
    {{ saving ? 'Guardando…' : 'Guardar' }}
  </button>
</mat-dialog-actions>

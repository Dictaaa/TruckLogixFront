<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <span class="page-eyebrow">Maestros</span>
      <h1 class="page-title">Usuarios</h1>
    </div>
    <button class="btn-primary" (click)="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Nuevo usuario
    </button>
  </div>

  <section class="table-section">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Documento</th>
            <th>Email</th>
            <th>Perfil</th>
            <th class="col-status">Estado</th>
            <th class="col-actions">Opciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading">
            <td colspan="7">
              <div class="loading-cell">
                <div class="spinner"></div>
                <span>Cargando…</span>
              </div>
            </td>
          </tr>

          <ng-container *ngIf="!loading">
            <tr *ngFor="let u of users" class="table-row">
              <td class="text-muted">{{ u.id }}</td>
              <td>{{ u.first_name }} {{ u.last_name }}</td>
              <td class="mono">{{ u.document_number ?? '—' }}</td>
              <td>{{ u.email }}</td>
              <td>
                <span class="badge"
                  [class.badge-admin]="u.role === 1"
                  [class.badge-aux]="u.role === 2"
                  [class.badge-afil]="u.role === 3">
                  {{ profiles[u.role] || '—' }}
                </span>
              </td>
              <td>
                <span class="badge" [class.badge-active]="u.active === true" [class.badge-inactive]="u.active !== true">
                  {{ u.active === true ? 'Activo' : 'Inactivo' }}
                </span>
              </td>
              <td class="col-actions">
                <app-table-actions
                  [actions]="actions"
                  (actionSelected)="onAction($event, u)">
                </app-table-actions>
              </td>
            </tr>

            <tr *ngIf="users.length === 0">
              <td colspan="7" class="empty-state">
                <p>No hay usuarios registrados</p>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </section>

</div>

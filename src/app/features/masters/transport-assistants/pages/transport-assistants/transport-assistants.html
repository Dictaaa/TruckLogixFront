<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <span class="page-eyebrow">Maestros</span>
      <h1 class="page-title">Auxiliares de Transporte</h1>
    </div>

    <button class="btn-primary" (click)="openModal()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        width="14"
        height="14">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Nuevo auxiliar
    </button>
  </div>

  <section class="table-section">

    <app-data-table
      [columns]="columns"
      [actions]="actions"
      [data]="table.rows"
      [total]="table.total"
      [loading]="loading"
      exportName="auxiliares-transporte"
      [showFilterBtn]="true"
      (pageChange)="onPageChange($event)"
      (actionSelect)="onAction($event)"
      (filterClick)="filterOpen = true">
    </app-data-table>

  </section>

</div>


<app-filter-panel
  [open]="filterOpen"
  [activeCount]="activeFilterCount"
  title="Filtros de auxiliares"
  (closed)="filterOpen = false"
  (apply)="applyFilters()"
  (clear)="clearFilters()">

  <div class="filter-fields">

    <!-- Fecha de creación -->
    <div class="filter-field">
      <label class="filter-label">Fecha de creación</label>

      <div class="filter-row-2">

        <div class="filter-field">
          <label class="filter-label">Desde</label>

          <input
            type="date"
            class="form-control"
            [max]="filters.fechaHasta || null"
            [(ngModel)]="filters.fechaDesde">
        </div>

        <div class="filter-field">
          <label class="filter-label">Hasta</label>

          <input
            type="date"
            class="form-control"
            [min]="filters.fechaDesde || null"
            [(ngModel)]="filters.fechaHasta">
        </div>

      </div>
    </div>

    <div class="filter-field">
      <label class="filter-label">Documento</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="filters.documento"
        placeholder="Buscar documento">
    </div>

    <div class="filter-field">
      <label class="filter-label">Nombre</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="filters.nombre"
        placeholder="Buscar nombre">
    </div>

    <div class="filter-field">
      <label class="filter-label">Teléfono</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="filters.telefono"
        placeholder="Buscar teléfono">
    </div>

    <div class="filter-field">
      <label class="filter-label">Estado</label>
      <select class="form-control" [(ngModel)]="filters.estado">
        <option value="">Todos</option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>

  </div>

</app-filter-panel>
